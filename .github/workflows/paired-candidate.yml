name: Paired Candidate (not public release)

on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Scripts/**'
      - 'Examples/**'
      - 'Package.swift'
      - '.github/core-candidate.sha'
      - '.github/workflows/paired-candidate.yml'

permissions:
  contents: read

concurrency:
  group: paired-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-candidate:
    name: Paired candidate — Xcode ${{ matrix.xcode.label }}
    runs-on: ${{ matrix.xcode.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        xcode:
          - label: '26.0.1'
            runner: macos-15
            path: /Applications/Xcode_26.0.1.app
          - label: '27.0'
            runner: xcode-27
            path: /Applications/Xcode.app
    env:
      INNONETWORK_LOCAL_PATH: ${{ github.workspace }}/.build/paired-core
    steps:
      - name: Checkout adapter candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate immutable paired core revision
        id: core
        shell: bash
        run: |
          set -euo pipefail
          sha=$(tr -d '\n' < .github/core-candidate.sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact core candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: InnoSquadCorp/InnoNetwork
          ref: ${{ steps.core.outputs.sha }}
          path: .build/paired-core
          persist-credentials: false
      - name: Verify pair and toolchain
        env:
          EXPECTED_CORE: ${{ steps.core.outputs.sha }}
        run: |
          test "$(git -C "$INNONETWORK_LOCAL_PATH" rev-parse HEAD)" = "$EXPECTED_CORE"
          sudo xcode-select -s '${{ matrix.xcode.path }}'
          xcodebuild -version
          xcrun swift --version
          printf 'Core: %s\nAdapter: %s\n' "$EXPECTED_CORE" "$(git rev-parse HEAD)"
      - name: Tests and compiler controls
        run: |
          xcrun swift test --no-parallel
          ruby Scripts/check_macro_compile_failures.rb
          bash Scripts/check_docs_contract_sync.sh
          ruby Scripts/test_release_gate.rb
      - name: External consumers and actual loopback transport
        run: |
          xcrun swift run InnoNetworkProtobufDocSmoke
          xcrun swift run --package-path Examples/ConsumerSmoke ConsumerSmoke
          xcrun swift run --package-path Examples/ConsumerSmoke LegacyConsumerSmoke
          bash Scripts/check_macro_disabled_consumer.sh
          report_dir=$(mktemp -d "$RUNNER_TEMP/network-validation.XXXXXX")
          xcrun swift run --package-path Examples/ValidationApp ValidationCLI "$report_dir"
          cp "$report_dir/latest-report.json" "$RUNNER_TEMP/candidate-cold.json"
          xcrun swift run --package-path Examples/ValidationApp ValidationCLI "$report_dir"
          cp "$report_dir/latest-report.json" "$RUNNER_TEMP/candidate-warm.json"
      - name: Platform macro builds on the compatibility toolchain
        if: matrix.xcode.label == '26.0.1'
        run: |
          bash Scripts/build_apple_platform_target.sh iOS iphonesimulator arm64-apple-ios16.0-simulator
          bash Scripts/build_apple_platform_target.sh tvOS appletvos arm64-apple-tvos16.0
          bash Scripts/build_apple_platform_target.sh watchOS watchos arm64_32-apple-watchos9.0
          bash Scripts/build_apple_platform_target.sh visionOS xros arm64-apple-xros1.0
      - name: Preserve synthetic loopback reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paired-loopback-${{ matrix.xcode.label }}
          path: ${{ runner.temp }}/candidate-*.json
