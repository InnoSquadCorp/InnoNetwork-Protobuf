name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-contracts:
    name: Static Contracts (no dependency resolution)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash Scripts/check_static_contracts.sh

  build-and-test:
    name: Build and Test — Xcode ${{ matrix.xcode.label }}
    runs-on: ${{ matrix.xcode.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        xcode:
          - label: "26.0.1"
            runner: macos-15
            path: /Applications/Xcode_26.0.1.app
          - label: "27.0"
            runner: xcode-27
            path: /Applications/Xcode.app

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        run: sudo xcode-select -s ${{ matrix.xcode.path }}

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Resolve dependencies
        run: |
          xcrun swift package resolve
          ruby Scripts/check_dependency_integrity.rb .build Package.resolved

      - name: Build
        run: xcrun swift build

      - name: Test
        run: xcrun swift test

      - name: Compile macro contracts
        run: ruby Scripts/check_macro_compile_failures.rb

  apple-platform-builds:
    name: Build — ${{ matrix.runtime }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: iOS
            sdk: iphonesimulator
            triple: arm64-apple-ios16.0-simulator
          - runtime: tvOS
            sdk: appletvos
            triple: arm64-apple-tvos16.0
          - runtime: watchOS
            sdk: watchos
            triple: arm64_32-apple-watchos9.0
          - runtime: visionOS
            sdk: xros
            triple: arm64-apple-xros1.0

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Require SDK
        run: xcrun --sdk '${{ matrix.sdk }}' --show-sdk-path

      - name: Build ${{ matrix.runtime }}
        env:
          RUNTIME: ${{ matrix.runtime }}
          SDK: ${{ matrix.sdk }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          bash Scripts/build_apple_platform_target.sh "$RUNTIME" "$SDK" "$TRIPLE"

  docs-contract-sync:
    name: Docs / Contract Sync
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Resolve dependencies
        run: |
          xcrun swift package resolve
          ruby Scripts/check_dependency_integrity.rb .build Package.resolved

      - name: Verify docs and stability contract
        run: |
          bash Scripts/check_docs_contract_sync.sh
          ruby Scripts/test_release_gate.rb

      - name: Build documentation smoke target
        run: xcrun swift build --target InnoNetworkProtobufDocSmoke

      - name: Run documentation smoke target
        run: xcrun swift run InnoNetworkProtobufDocSmoke

  consumer-smoke:
    name: Consumer Smoke
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Build and run preferred and compatibility product consumers
        working-directory: Examples/ConsumerSmoke
        run: |
          xcrun swift run ConsumerSmoke
          xcrun swift run LegacyConsumerSmoke
          ruby ../../Scripts/check_dependency_integrity.rb .build Package.resolved

      - name: Verify macro-disabled consumer graph
        run: bash Scripts/check_macro_disabled_consumer.sh
