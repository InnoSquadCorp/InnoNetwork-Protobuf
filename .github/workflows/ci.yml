name: CI
run-name: >-
  ${{ (github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base))) && format('CI metadata-only v1 pr:{0} head:{1} base:{2} action:{3} source:{4}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha, github.event.action, github.workflow_sha) || (github.event_name == 'pull_request' && format('CI validation v2 pr:{0} head:{1} base:{2} source:{3} release:{4} asan:{5} concurrency:{6}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha, github.sha, contains(github.event.pull_request.labels.*.name, 'release-validation'), false, false) || format('CI validation / {0} / {1}', github.event_name, github.ref)) }}

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base))) }}
  queue: ${{ (github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base))) && 'max' || 'single' }}

permissions:
  contents: read

jobs:
  ci-plan:
    name: CI Plan
    if: ${{ !(github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan exact changed paths
        id: plan
        run: python3 -B Scripts/ci-policy.py plan --event "$GITHUB_EVENT_PATH" --output .build/ci-plan.json

  policy:
    name: CI Policy
    needs: ci-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify planning and workflow contracts
        run: |
          python3 -B -m unittest discover -s Scripts/automation-tests -v
          python3 -B Scripts/check-ci-workflows.py

  static-contracts:
    if: ${{ !(github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base))) }}
    name: Static Contracts (no dependency resolution)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash Scripts/check_static_contracts.sh

  build-and-test:
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.build-and-test
    name: Build and Test — Xcode ${{ matrix.xcode.label }}
    runs-on: ${{ matrix.xcode.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        xcode:
          - label: "26.0.1"
            runner: macos-15
            path: /Applications/Xcode_26.0.1.app
          - label: "27.0"
            runner: xcode-27
            path: /Applications/Xcode.app

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s ${{ matrix.xcode.path }}

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Resolve dependencies
        run: |
          xcrun swift package resolve
          ruby Scripts/check_dependency_integrity.rb .build Package.resolved

      - name: Validate exact public candidate
        env:
          VALIDATION_MODE: ${{ fromJSON(needs.ci-plan.outputs.plan).lane == 'release-validation' && 'release' || 'standard' }}
        run: env -u INNONETWORK_LOCAL_PATH bash Scripts/validate_candidate.sh "$VALIDATION_MODE"

      - name: Preserve synthetic validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-${{ matrix.xcode.label }}
          path: |
            ${{ runner.temp }}/protobuf-validation.*/cold.json
            ${{ runner.temp }}/protobuf-validation.*/warm.json

  apple-platform-builds:
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.apple-platform-builds
    name: Build — ${{ matrix.runtime }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: iOS
            sdk: iphonesimulator
            triple: arm64-apple-ios16.0-simulator
          - runtime: tvOS
            sdk: appletvos
            triple: arm64-apple-tvos16.0
          - runtime: watchOS
            sdk: watchos
            triple: arm64_32-apple-watchos9.0
          - runtime: visionOS
            sdk: xros
            triple: arm64-apple-xros1.0

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Require SDK
        run: xcrun --sdk '${{ matrix.sdk }}' --show-sdk-path

      - name: Build ${{ matrix.runtime }}
        env:
          RUNTIME: ${{ matrix.runtime }}
          SDK: ${{ matrix.sdk }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          bash Scripts/build_apple_platform_target.sh "$RUNTIME" "$SDK" "$TRIPLE"

  docs-contract-sync:
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.docs-contract-sync
    name: Docs / Contract Sync
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Resolve dependencies
        run: |
          xcrun swift package resolve
          ruby Scripts/check_dependency_integrity.rb .build Package.resolved

      - name: Verify docs and stability contract
        run: |
          bash Scripts/check_docs_contract_sync.sh
          ruby Scripts/test_release_gate.rb

      - name: Build documentation smoke target
        run: xcrun swift build --target InnoNetworkProtobufDocSmoke

      - name: Run documentation smoke target
        run: xcrun swift run InnoNetworkProtobufDocSmoke

  consumer-smoke:
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.consumer-smoke
    name: Consumer Smoke
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Build and run preferred and compatibility product consumers
        working-directory: Examples/ConsumerSmoke
        run: |
          xcrun swift run ConsumerSmoke
          xcrun swift run LegacyConsumerSmoke
          ruby ../../Scripts/check_dependency_integrity.rb .build Package.resolved

      - name: Verify macro-disabled consumer graph
        run: bash Scripts/check_macro_disabled_consumer.sh
  paired-candidate:
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.paired-candidate
    name: Paired candidate — Xcode ${{ matrix.xcode.label }}
    runs-on: ${{ matrix.xcode.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        xcode:
          - label: '26.0.1'
            runner: macos-15
            path: /Applications/Xcode_26.0.1.app
          - label: '27.0'
            runner: xcode-27
            path: /Applications/Xcode.app
    env:
      INNONETWORK_LOCAL_PATH: ${{ github.workspace }}/.build/paired-core
    steps:
      - name: Checkout adapter candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate immutable paired core revision
        id: core
        shell: bash
        run: |
          set -euo pipefail
          ruby Scripts/test_core_candidate.rb
          sha=$(ruby Scripts/check_core_candidate.rb)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact core candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: InnoSquadCorp/InnoNetwork
          ref: ${{ steps.core.outputs.sha }}
          path: .build/paired-core
          persist-credentials: false
      - name: Verify pair and toolchain
        env:
          EXPECTED_CORE: ${{ steps.core.outputs.sha }}
        run: |
          ruby Scripts/check_core_candidate.rb "$INNONETWORK_LOCAL_PATH"
          sudo xcode-select -s '${{ matrix.xcode.path }}'
          xcodebuild -version
          xcrun swift --version
          printf 'Core: %s\nAdapter: %s\n' "$EXPECTED_CORE" "$(git rev-parse HEAD)"
      - name: Validate immutable pair through the shared contract
        run: bash Scripts/validate_candidate.sh standard
      - name: Platform macro builds on the compatibility toolchain
        if: matrix.xcode.label == '26.0.1'
        run: |
          bash Scripts/build_apple_platform_target.sh iOS iphonesimulator arm64-apple-ios16.0-simulator
          bash Scripts/build_apple_platform_target.sh tvOS appletvos arm64-apple-tvos16.0
          bash Scripts/build_apple_platform_target.sh watchOS watchos arm64_32-apple-watchos9.0
          bash Scripts/build_apple_platform_target.sh visionOS xros arm64-apple-xros1.0

      - name: Preserve synthetic validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paired-${{ matrix.xcode.label }}
          path: |
            ${{ runner.temp }}/protobuf-validation.*/cold.json
            ${{ runner.temp }}/protobuf-validation.*/warm.json

  ci-required:
    name: CI Required
    if: ${{ always() }}
    needs: ['ci-plan', 'policy', 'build-and-test', 'docs-contract-sync', 'consumer-smoke', 'apple-platform-builds', 'static-contracts', 'paired-candidate']
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require every selected validation
        if: ${{ !(github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base))) }}
        env:
          CI_PLAN: ${{ needs.ci-plan.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B Scripts/ci-policy.py evaluate
      - name: Verify prior validation for metadata
        if: ${{ (github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base))) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B Scripts/verify-ci-metadata.py --check 'CI Required'
