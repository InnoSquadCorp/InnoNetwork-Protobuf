name: Release

on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version (validation does not create tags)
        default: "6.0.0"
        required: true
        type: string
      publish:
        description: Publish an existing annotated Ready tag after validation
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve Release Identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      tag_object: ${{ steps.identity.outputs.tag_object }}
    steps:
      - name: Checkout immutable release policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Resolve existing remote tag
        id: identity
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: python3 -B Scripts/release-ref.py --tag "$RELEASE_TAG" --expected-sha "$EXPECTED_SHA"

  validate-release:
    needs: resolve-release
    name: Validate Release
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.commit_sha }}

      - name: Checkout immutable identity policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .ci-release-policy
          sparse-checkout: Scripts/release-ref.py
          sparse-checkout-cone-mode: false

      - name: Verify exact release identity
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve-release.outputs.commit_sha }}
          RELEASE_TAG_OBJECT: ${{ needs.resolve-release.outputs.tag_object }}
        run: python3 -B .ci-release-policy/Scripts/release-ref.py --tag "$RELEASE_TAG" --expected-sha "$RELEASE_SHA" --expected-tag-object "$RELEASE_TAG_OBJECT" --require-head

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app
      - name: Validate candidate and publication intent
        id: candidate
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          mode=validate
          if [[ "$PUBLISH" == true ]]; then mode=publish; fi
          bash Scripts/check_release_gate.sh "$mode" "$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Resolve public dependencies
        run: |
          env -u INNONETWORK_LOCAL_PATH xcrun swift package resolve
          ruby Scripts/check_dependency_integrity.rb .build Package.resolved
      - name: Contracts and release negative controls
        run: |
          bash Scripts/check_docs_contract_sync.sh
          ruby Scripts/test_release_gate.rb
      - name: Tests and executable examples
        run: |
          xcrun swift test
          xcrun swift run InnoNetworkProtobufDocSmoke
          xcrun swift run --package-path Examples/ConsumerSmoke ConsumerSmoke
          xcrun swift run --package-path Examples/ConsumerSmoke LegacyConsumerSmoke
          ruby Scripts/check_dependency_integrity.rb Examples/ConsumerSmoke/.build Examples/ConsumerSmoke/Package.resolved
      - name: Five-platform verification (macOS above)
        run: |
          bash Scripts/build_apple_platform_target.sh iOS iphonesimulator arm64-apple-ios16.0-simulator
          bash Scripts/build_apple_platform_target.sh tvOS appletvos arm64-apple-tvos16.0
          bash Scripts/build_apple_platform_target.sh watchOS watchos arm64_32-apple-watchos9.0
          bash Scripts/build_apple_platform_target.sh visionOS xros arm64-apple-xros1.0

  publish-release:
    name: Publish Release
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    environment: release
    needs: [resolve-release, validate-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.commit_sha }}

      - name: Recheck publication gate and release notes
        id: notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          bash Scripts/check_release_gate.sh publish "$RELEASE_VERSION"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes_path=docs/releases/$version.md" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable identity policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .ci-release-policy
          sparse-checkout: Scripts/release-ref.py
          sparse-checkout-cone-mode: false

      - name: Verify exact release identity
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve-release.outputs.commit_sha }}
          RELEASE_TAG_OBJECT: ${{ needs.resolve-release.outputs.tag_object }}
        run: python3 -B .ci-release-policy/Scripts/release-ref.py --tag "$RELEASE_TAG" --expected-sha "$RELEASE_SHA" --expected-tag-object "$RELEASE_TAG_OBJECT" --require-head

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          target_commitish: ${{ needs.resolve-release.outputs.commit_sha }}
          name: InnoNetworkProtobuf ${{ steps.notes.outputs.version }}
          body_path: ${{ steps.notes.outputs.notes_path }}
