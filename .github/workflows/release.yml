name: Release

on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version (validation does not create tags)
        default: "6.1.1"
        required: true
        type: string
      publish:
        description: Publish an existing annotated Ready tag after validation
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve Release Identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      tag_object: ${{ steps.identity.outputs.tag_object }}
    steps:
      - name: Checkout immutable release policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Resolve existing remote tag
        id: identity
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: python3 -B Scripts/release-ref.py --tag "$RELEASE_TAG" --expected-sha "$EXPECTED_SHA"

  validate-release:
    needs: resolve-release
    name: Validate Release — Xcode ${{ matrix.xcode.label }}
    runs-on: ${{ matrix.xcode.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        xcode:
          - label: "26.0.1"
            runner: macos-15
            path: /Applications/Xcode_26.0.1.app
          - label: "27.0"
            runner: xcode-27
            path: /Applications/Xcode.app
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.commit_sha }}

      - name: Checkout immutable identity policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .ci-release-policy
          sparse-checkout: Scripts/release-ref.py
          sparse-checkout-cone-mode: false

      - name: Verify exact release identity
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve-release.outputs.commit_sha }}
          RELEASE_TAG_OBJECT: ${{ needs.resolve-release.outputs.tag_object }}
        run: python3 -B .ci-release-policy/Scripts/release-ref.py --tag "$RELEASE_TAG" --expected-sha "$RELEASE_SHA" --expected-tag-object "$RELEASE_TAG_OBJECT" --require-head

      - name: Select Xcode
        run: sudo xcode-select -s ${{ matrix.xcode.path }}
      - name: Validate candidate and publication intent
        id: candidate
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          mode=validate
          if [[ "$PUBLISH" == true ]]; then mode=publish; fi
          bash Scripts/check_release_gate.sh "$mode" "$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Contracts and release negative controls
        run: |
          bash Scripts/check_docs_contract_sync.sh
          ruby Scripts/test_release_gate.rb
      - name: Validate complete public release candidate
        run: env -u INNONETWORK_LOCAL_PATH bash Scripts/validate_candidate.sh release
      - name: Five-platform verification (macOS above)
        if: matrix.xcode.label == '26.0.1'
        run: |
          bash Scripts/build_apple_platform_target.sh iOS iphonesimulator arm64-apple-ios16.0-simulator
          bash Scripts/build_apple_platform_target.sh tvOS appletvos arm64-apple-tvos16.0
          bash Scripts/build_apple_platform_target.sh watchOS watchos arm64_32-apple-watchos9.0
          bash Scripts/build_apple_platform_target.sh visionOS xros arm64-apple-xros1.0

      - name: Preserve synthetic validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.xcode.label }}
          path: |
            ${{ runner.temp }}/protobuf-validation.*/cold.json
            ${{ runner.temp }}/protobuf-validation.*/warm.json

  publish-release:
    name: Publish Release
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    environment: release
    needs: [resolve-release, validate-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.commit_sha }}

      - name: Recheck publication gate and release notes
        id: notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          bash Scripts/check_release_gate.sh publish "$RELEASE_VERSION"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes_path=docs/releases/$version.md" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable identity policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .ci-release-policy
          sparse-checkout: Scripts/release-ref.py
          sparse-checkout-cone-mode: false

      - name: Verify exact release identity
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve-release.outputs.commit_sha }}
          RELEASE_TAG_OBJECT: ${{ needs.resolve-release.outputs.tag_object }}
        run: python3 -B .ci-release-policy/Scripts/release-ref.py --tag "$RELEASE_TAG" --expected-sha "$RELEASE_SHA" --expected-tag-object "$RELEASE_TAG_OBJECT" --require-head

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          target_commitish: ${{ needs.resolve-release.outputs.commit_sha }}
          name: InnoNetworkProtobuf ${{ steps.notes.outputs.version }}
          body_path: ${{ steps.notes.outputs.notes_path }}

  published-consumer:
    name: Verify Published Tag Consumer
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [resolve-release, publish-release]
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-release.outputs.commit_sha }}
          persist-credentials: false
      - name: Select compatibility toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app
          xcodebuild -version
          xcrun swift --version
      - name: Resolve and execute both published tags
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve-release.outputs.commit_sha }}
        run: bash Scripts/validate_published_consumer.sh "${RELEASE_TAG#v}" "$RELEASE_SHA"
      - name: Validate skill examples against the published release identity
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve-release.outputs.commit_sha }}
          RELEASE_TAG_OBJECT: ${{ needs.resolve-release.outputs.tag_object }}
        run: |
          env -u INNONETWORK_LOCAL_PATH python3 skills/innonetwork-protobuf/scripts/validate_consumer.py \
            --release-tag "$RELEASE_TAG" --expected-adapter-revision "$RELEASE_SHA" \
            --expected-tag-object "$RELEASE_TAG_OBJECT" --scratch-path "$RUNNER_TEMP/protobuf-skill-release"
      - name: Preserve public consumer lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-consumer-lock
          path: |
            ${{ runner.temp }}/protobuf-published.*/consumer/Package.resolved
            ${{ runner.temp }}/protobuf-skill-release/skill-runs/**/evidence.json
            ${{ runner.temp }}/protobuf-skill-release/skill-runs/**/*.log
            ${{ runner.temp }}/protobuf-skill-release/skill-runs/**/consumer/Package.resolved
