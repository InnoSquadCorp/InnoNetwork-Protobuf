name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to validate and publish, for example 6.0.0
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate Release
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Resolve dependencies
        run: xcrun swift package resolve

      - name: Verify docs and stability contract
        run: bash Scripts/check_docs_contract_sync.sh

      - name: Build and run documentation smoke target
        run: |
          xcrun swift build --target InnoNetworkProtobufDocSmoke
          xcrun swift run InnoNetworkProtobufDocSmoke

      - name: Build and run preferred and compatibility product consumers
        working-directory: Examples/ConsumerSmoke
        run: |
          xcrun swift run ConsumerSmoke
          xcrun swift run LegacyConsumerSmoke

      - name: Run tests
        run: xcrun swift test

      - name: Build iOS package graph
        run: |
          xcodebuild \
            -scheme InnoNetwork-Protobuf-Package \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build tvOS, watchOS, and visionOS package graphs
        run: |
          bash Scripts/build_apple_platform_target.sh \
            tvOS appletvos arm64-apple-tvos16.0
          bash Scripts/build_apple_platform_target.sh \
            watchOS watchos arm64_32-apple-watchos9.0
          bash Scripts/build_apple_platform_target.sh \
            visionOS xros arm64-apple-xros1.0

  publish-release:
    name: Publish Release
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          notes_source="docs/releases/${version}.md"
          notes_target="release-notes.md"

          if [[ -f "$notes_source" ]]; then
            cp "$notes_source" "$notes_target"
          else
            printf '%s\n' \
              "# InnoNetwork-Protobuf ${version}" \
              "" \
              "See CHANGELOG.md for the summarized release history." > "$notes_target"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "notes_path=${notes_target}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: InnoNetwork-Protobuf ${{ steps.notes.outputs.version }}
          body_path: ${{ steps.notes.outputs.notes_path }}
